<!DOCTYPE html>
<html>
<head>
    <title>Chickasha Slopmap 🧙‍♂️</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #fff; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #f8f9fa; }
        
        /* Hoodmaps Style UI */
        .ui-overlay {
            position: absolute; z-index: 1000; background: white; 
            padding: 12px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .header { top: 20px; left: 20px; width: 260px; }
        .header h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -0.5px; color: #000; text-transform: uppercase; }
        .header small { color: #666; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        .legend { bottom: 40px; left: 20px; min-width: 180px; }
        .legend-title { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #999; margin-bottom: 10px; letter-spacing: 1px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 10px; cursor: pointer; transition: transform 0.1s; }
        .legend-item:hover { transform: translateX(5px); }
        .swatch { width: 14px; height: 14px; margin-right: 12px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); }
        .legend-label { font-size: 13px; font-weight: 600; color: #333; }
        
        /* HOODMAPS TAGS */
        .poi-tag {
            display: flex;
            align-items: center;
            background: white;
            border: 2px solid #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 800;
            color: #000;
            white-space: nowrap;
            box-shadow: 4px 4px 0px rgba(0,0,0,1);
            transform: rotate(-1deg);
            transition: all 0.2s;
        }
        .poi-tag:hover {
            transform: rotate(0deg) scale(1.1);
            box-shadow: 6px 6px 0px rgba(0,0,0,1);
            z-index: 2000;
        }
        .portfolio-tag {
            background: #000 !important;
            color: #fff !important;
            border: 2px solid #fff !important;
            box-shadow: 4px 4px 0px rgba(255,255,255,0.5) !important;
        }
        .poi-tag i {
            margin-right: 6px;
            font-size: 14px;
        }

        .fab {
            position: absolute; bottom: 40px; right: 20px; z-index: 1000;
            background: #000; color: #fff; width: 56px; height: 56px; border-radius: 28px;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); cursor: pointer;
        }

        /* Leaflet Overrides */
        .leaflet-container { background: #f8f9fa !important; }
        .leaflet-bar { border: none !important; box-shadow: 0 4px 10px rgba(0,0,0,0.1) !important; }
    </style>
</head>
<body>
    <div class="ui-overlay header">
        <h1>CHICKASHA MAP 🧙‍♂️</h1>
        <small>Tactical Slop Logic v0.3</small>
    </div>

    <div id="map"></div>

    <div class="ui-overlay legend">
        <div class="legend-title">Tactical Layers</div>
        <div class="legend-item"><div class="swatch" style="background: #ff4757;"></div> <span class="legend-label">Avoid / High Crime</span></div>
        <div class="legend-item"><div class="swatch" style="background: #2ed573;"></div> <span class="legend-label">Cash Flow / Yield</span></div>
        <div class="legend-item"><div class="swatch" style="background: #ffa502;"></div> <span class="legend-label">Appreciation / Rich</span></div>
        <div class="legend-item"><div class="swatch" style="background: #1e90ff;"></div> <span class="legend-label">Normies</span></div>
        <div class="legend-item"><div class="swatch" style="background: #5f27cd;"></div> <span class="legend-label">Uni / Students</span></div>
        <div class="legend-item"><div class="swatch" style="background: #2f3542;"></div> <span class="legend-label">Industrial Slop</span></div>
    </div>

    <div class="fab">
        <i class="fas fa-plus"></i>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { 
            zoomControl: true,
            attributionControl: false 
        }).setView([35.0526, -97.9364], 14); 

        // 1. BASE LAYER (Water, Parks, etc. - Low Z-Index)
        // We use CartoDB Positron No Labels to get the clean background but keep it under our shading.
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            pane: 'tilePane'
        }).addTo(map);

        // 2. CREATE PANES for Layer Sandwiches
        map.createPane('slopPane');
        map.getPane('slopPane').style.zIndex = 400; // Above base tiles
        map.getPane('slopPane').style.pointerEvents = 'none';

        map.createPane('labelPane');
        map.getPane('labelPane').style.zIndex = 650; // Above shading but below POI tags
        map.getPane('labelPane').style.pointerEvents = 'none';

        // 3. STREET LABELS (Top Layer of Sandwich)
        // This ensures streets are ALWAYS readable.
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            pane: 'labelPane'
        }).addTo(map);

        // Icon mapping for Hoodmaps-style tags
        const getIcon = (name) => {
            name = name.toLowerCase();
            if (name.includes('university') || name.includes('usao')) return 'fa-graduation-cap';
            if (name.includes('lamp')) return 'fa-lightbulb';
            if (name.includes('hospital')) return 'fa-hospital';
            if (name.includes('park')) return 'fa-tree';
            if (name.includes('airport')) return 'fa-plane';
            if (name.includes('stadium')) return 'fa-stadium';
            if (name.includes('school')) return 'fa-school';
            if (name.includes('walmart')) return 'fa-cart-shopping';
            if (name.includes('st')) return 'fa-house-chimney';
            if (name.includes('colorado')) return 'fa-house-chimney';
            return 'fa-location-dot';
        };

        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: (feature) => {
                        if (feature.geometry.type === 'Polygon') {
                            return {
                                fillColor: feature.properties.color,
                                color: '#000',
                                weight: 0.5,
                                fillOpacity: 0.6,
                                pane: 'slopPane'
                            };
                        }
                    },
                    pointToLayer: (feature, latlng) => {
                        const isPortfolio = feature.properties.type === 'portfolio';
                        const iconClass = isPortfolio ? 'fa-briefcase' : getIcon(feature.properties.name);
                        
                        const label = L.divIcon({
                            className: 'poi-tag-container',
                            html: `<div class="poi-tag ${isPortfolio ? 'portfolio-tag' : ''}"><i class="fas ${iconClass}"></i>${feature.properties.name}</div>`,
                            iconSize: null,
                            iconAnchor: [0, 0]
                        });
                        return L.marker(latlng, { icon: label, zIndexOffset: isPortfolio ? 2000 : 1000 });
                    },
                    onEachFeature: (feature, layer) => {
                        if (feature.properties.label) {
                            layer.bindPopup(`<strong>${feature.properties.name}</strong><br>${feature.properties.label}`);
                        }
                    }
                }).addTo(map);
            })
            .catch(err => console.error('Error loading data:', err));
            
        map.zoomControl.setPosition('topright');
    </script>
</body>
</html>
